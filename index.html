<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Meu modelo 3D</title>

  <script
    type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
    }

    h1 {
      margin: 20px;
    }

    model-viewer {
      width: 100%;
      height: 70vh;
      background-color: #eeeeee;
    }
  </style>
</head>

<body>

  <h1>Meu modelo 3D</h1>

  <model-viewer
    src="modelo.glb"
    alt="Modelo 3D"
    camera-controls
    auto-rotate
    ar>
  </model-viewer>

</body>

</html>
