<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js">
  </script>

  <title>Modelo em Realidade Aumentada</title>
</head>

<body>

  <model-viewer
    alt="Modelo 3D em realidade aumentada"
    src="modelo.glb"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    touch-action="pan-y"
    shadow-intensity="1"
    auto-rotate
    style="width: 100%; height: 500px;">

    <button
  slot="ar-button"
  style="
    background-color: #f58220;
    color: #ffffff;
    border: none;
    border-radius: 20px;
    padding: 12px 20px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
  ">
  📱 Ver em realidade aumentada
</button>

  </model-viewer>

</body>
</html>
